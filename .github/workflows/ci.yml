name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The lock file is written by npm 12 (see packageManager in package.json).
      - run: npm install -g npm@12.2.0
      - run: npm ci

      - name: Configure environment
        run: |
          cp .env.example .env
          sed -i "s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=$(openssl rand -base64 32)|" .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -base64 48)|" .env

      - name: Start Postgres, Redis and S3
        run: docker compose up -d --wait postgres redis s3

      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run test:e2e

      - name: Build image
        run: docker build -t flow-backend .
