services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flow
      POSTGRES_PASSWORD: flow
      POSTGRES_DB: flow
    ports:
      - '${POSTGRES_PORT:-5440}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flow -d flow']
      interval: 5s
      timeout: 3s
      retries: 10

  # Not used yet; BullMQ queues arrive in v0.2.
  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6390}:6379'
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
